<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | MSL Event</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; background-color: #f4f6f8; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; color: #1e3a8a; }
        .btn-group { margin-bottom: 20px; display: flex; gap: 10px; }
        button { padding: 10px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-fetch { background-color: #2563eb; color: white; }
        .btn-export { background-color: #16a34a; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: right; }
        th { background-color: #f1f5f9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>لوحة تحكم المسجلين (MSL Event)</h1>
        <div class="btn-group">
            <button class="btn-fetch" onclick="fetchStudents()">🔄 تحديث البيانات</button>
            <button class="btn-export" onclick="exportCSV()">📥 تحميل ملف Excel (CSV)</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>الاسم</th>
                    <th>النوع</th>
                    <th>الجامعة</th>
                    <th>التخصص</th>
                    <th>السنة</th>
                    <th>الهاتف</th>
                    <th>تيليجرام</th>
                </tr>
            </thead>
            <tbody id="studentsTable">
                <tr><td colspan="7" style="text-align:center;">اضغطي على "تحديث البيانات" للجلب.</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const REPO_URL = "https://api.github.com/repos/ilhamseid6000-lgtm/msl-event/contents/students.json";
        let studentsData = [];

        async function fetchStudents() {
            try {
                const response = await fetch(REPO_URL);
                if (!response.ok) throw new Error("تعذر جلب البيانات");
                const data = await response.json();
                const content = decodeURIComponent(escape(atob(data.content)));
                studentsData = JSON.parse(content);

                const tbody = document.getElementById("studentsTable");
                tbody.innerHTML = "";

                if (studentsData.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">لا توجد بيانات مسجلة حتى الآن.</td></tr>';
                    return;
                }

                studentsData.forEach(student => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${student.name || '-'}</td>
                        <td>${student.gender || '-'}</td>
                        <td>${student.university || '-'}</td>
                        <td>${student.department || '-'}</td>
                        <td>${student.year || '-'}</td>
                        <td>${student.phone || '-'}</td>
                        <td>${student.telegram || '-'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                alert("خطأ أثناء جلب البيانات: " + err.message);
            }
        }

        function exportCSV() {
            if (!studentsData || studentsData.length === 0) {
                alert("لا توجد بيانات لتحميلها! قومي بتحديث البيانات أولاً.");
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "الاسم,النوع,الجامعة,التخصص,السنة,الهاتف,تيليجرام\n";

            studentsData.forEach(s => {
                csvContent += `"${s.name || ''}","${s.gender || ''}","${s.university || ''}","${s.department || ''}","${s.year || ''}","${s.phone || ''}","${s.telegram || ''}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "students_list.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
